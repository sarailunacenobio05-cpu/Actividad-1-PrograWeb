<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 15</title>
    <link rel="stylesheet" href="css/Ejercicio 15.css">
    <script src="js/Ejercicio 15.js"></script>
    
</head>
<body>
    <div class="contenedor-regresar">
        <a href="index.html" class="btn-regresar">
        <img src="img/caja.png" alt="Menú" style="width: 20px; height: 20px;"> Menú
        </a>
    </div>
    <div class="contenedor-formulario">
        <h1>Objetos</h1>
        
        <form class="formulario">
                
                <div class="grupo-formulario">
                    <label for="nombre">Ingresa el nombre del estudiante:</label>
                    <input type="text" id="nombre"  required>
                    <label for="calificacion">Ingresa la calificacion del estudiante:</label>
                    <input type="number" id="calificacion"  required>
                </div>
                <div class="grupo-formulario">
                    <label for="promedio">El promedio es:</label>
                    <input type="number" id="promedio" readonly>
                    <label for="mayor">El estudiante con la calificacion mas alta es:</label>
                    <input type="text" id="mayor" readonly>
                    <label for="menor">El estudiante con la calificacion mas baja es:</label>
                    <input type="text" id="menor" readonly>
                </div>
                <br>
                <div class="contenedor-botones">
                    <button type="button" onclick="agregar()" class="Bagregar">Agregar estudiante</button>
                    <button type="button" onclick="calcular()" class="Bconvertir">Calcular</button>
                </div>
            
            
        </form>
    </div>  
</body>
</html>
