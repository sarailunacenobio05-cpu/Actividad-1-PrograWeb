<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | DevSolutions</title>
    <link rel="stylesheet" href="css/Ejercicio 9.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;&display=swap" rel="stylesheet">
</head>
<body>
    <div class="contenedor-regresar">
            <a href="index.html" class="btn-regresar">
            <img src="img/caja.png" alt="Menú" style="width: 20px; height: 20px;"> Menú
            </a>
        </div>
    <div class="contenedor-formulario">
        <h1>Contactanos</h1>
        <p class="subtitulo">¿Tienes dudas? Escribenos y te responderemos en 24h.</p>
        <form class="formulario">
            <div class="grupo-formulario">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" placeholder="Ej: Ana Perez" required>
            </div>

            <div class="grupo-doble">
                <div class="grupo-formulario">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="ana@ejemplo.com" required>
                </div>
                    <div class="grupo-formulario">
                        <label for="telefono">Telefono <span>(opcional1)</span></label>
                        <input type="tel" id="telefono" placeholder="+52 55 1234 5678">
                    </div>
            </div>

            <div class="grupo-formulario">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" rows="5" placeholder="Describe tu consulta..." required></textarea>
            </div>

            <button type="submit" class="boton-enviar">
                Enviar mensaje <span>→</span>
            </button>
            
        </form>
    </div>
    
</body>
</html>
